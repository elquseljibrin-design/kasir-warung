<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport"/>
  <title>Kasir Warung</title>

  <!-- ===== PWA ===== -->
  <meta name="theme-color" content="#0E7C66"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Kasir Warung"/>
  <link rel="icon" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.json"/>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#0E7C66; --primary-dark:#0B5E4E; --bg:#F3F6F1; --card:#ffffff;
      --text:#16302B; --muted:#6F7A73; --border:#E1E6DE; --success:#2F9E44; --danger:#D64545;
      --warning:#C97F00; --amber:#F0A202; --amber-dark:#C97F00; --stitch:#B9C4B4;
      --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'Space Mono',monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
    h1,h2,h3,.brand,.login-card h1,.modal h3,nav.tabs button{font-family:var(--font-display);}
    .app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
    /* garis putus-putus ala sobekan struk, dipakai sebagai pembatas signature */
    .perforated{border:none;border-top:2px dashed var(--stitch);margin:10px 0;position:relative;}
    /* Login */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
      radial-gradient(circle at 15% 20%, rgba(14,124,102,.08) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(240,162,2,.10) 0, transparent 45%), var(--bg);}
    .login-card{background:var(--card);padding:0 0 28px;border-radius:20px;box-shadow:0 12px 34px rgba(22,48,43,.14);width:100%;max-width:380px;overflow:hidden;}
    .login-banner{background:linear-gradient(135deg,var(--primary),var(--primary-dark));padding:30px 24px 22px;text-align:center;position:relative;}
    .login-banner .icon{font-size:34px;line-height:1;margin-bottom:6px;}
    .login-card h1{font-size:22px;margin:0;text-align:center;color:#fff;font-weight:700;}
    .login-card .tagline{color:rgba(255,255,255,.85);text-align:center;margin:4px 0 0;font-size:12.5px;font-family:var(--font-body);}
    .login-card .form-area{padding:24px 28px 0;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;}
    .field input,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--font-body);background:#fbfcfa;}
    .field input:focus,.field select:focus{outline:none;border-color:var(--primary);}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;font-family:var(--font-body);}
    .btn-primary{background:var(--primary);color:#fff;width:100%;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-block{width:100%;}
    .error-msg{background:#fdf0f0;color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
    /* Header/Nav - gaya papan nama warung */
    header.topbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(11,94,78,.25);}
    header.topbar .brand{font-weight:700;font-size:18px;color:#fff;display:flex;align-items:center;gap:8px;letter-spacing:.2px;}
    header.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(240,162,2,.3);flex-shrink:0;}
    header.topbar .btn-outline{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff;}
    nav.tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto;position:sticky;top:57px;z-index:19;}
    nav.tabs button{background:none;border:none;padding:13px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
    nav.tabs button.active{color:var(--primary);border-bottom-color:var(--amber);}
    main{flex:1;padding:16px;}
    .page{display:none;}
    .page.active{display:block;}
    .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(22,48,43,.06);margin-bottom:14px;border:1px solid var(--border);}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:720px){.grid-2{grid-template-columns:1fr;}}
    /* Kasir page */
    .kasir-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
    @media(max-width:820px){.kasir-layout{grid-template-columns:1fr;}}
    .search-box{position:relative;margin-bottom:12px;display:flex;gap:8px;}
    .search-box input{flex:1;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;background:#fff;}
    .btn-scan{background:var(--amber);color:#fff;border:none;border-radius:12px;padding:0 16px;font-size:18px;cursor:pointer;flex-shrink:0;}
    .field-with-scan{display:flex;gap:8px;align-items:flex-end;}
    .field-with-scan .field{flex:1;margin-bottom:0;}
    .btn-scan-small{background:var(--amber);color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer;flex-shrink:0;}
    #scannerContainer{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:260px;}
    #scannerContainer video{border-radius:12px;}
    .scan-hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:10px;}
    .scan-found{background:#eef8ee;border:1px solid #bfe3c2;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;display:none;}
    .kategori-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
    .chip{padding:7px 14px;border-radius:20px;background:#E9F2EE;color:var(--primary);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;border:1px solid transparent;font-family:var(--font-body);}
    .chip.active{background:var(--primary);color:#fff;}
    .produk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
    .produk-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;transition:.12s;position:relative;overflow:hidden;}
    .produk-item::before{content:'';position:absolute;top:0;left:0;width:5px;height:100%;background:var(--kat-color,var(--primary));opacity:.75;}
    .produk-item:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 14px rgba(22,48,43,.08);}
    .produk-item:active{transform:scale(.97);}
    .produk-item .nama{font-size:13px;font-weight:600;margin-bottom:4px;min-height:34px;padding-left:4px;}
    .produk-item .harga{color:var(--primary);font-weight:700;font-size:14px;padding-left:4px;font-family:var(--font-mono);}
    .produk-item .stok{font-size:11px;color:var(--muted);margin-top:2px;padding-left:4px;}
    .produk-item .stok.low{color:var(--warning);font-weight:600;}
    .produk-item .stok.habis{color:var(--danger);font-weight:600;}
    .cart-card{position:sticky;top:110px;}
    .cart-card h3{color:var(--text);}
    .cart-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
    .cart-item .info{flex:1;min-width:0;}
    .cart-item .info .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cart-item .info .h{font-size:12px;color:var(--muted);font-family:var(--font-mono);}
    .qty-ctrl{display:flex;align-items:center;gap:6px;}
    .qty-ctrl button{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px;line-height:1;color:var(--primary);font-weight:700;}
    .qty-ctrl span{min-width:20px;text-align:center;font-size:13px;font-weight:700;font-family:var(--font-mono);}
    .cart-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px;}
    .total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
    .total-row span:last-child{font-family:var(--font-mono);}
    .total-row.grand{font-size:19px;font-weight:700;border:none;border-top:2px dashed var(--stitch);margin-top:8px;padding-top:12px;color:var(--primary-dark);}
    /* Produk manajemen */
    table{width:100%;border-collapse:collapse;font-size:13px;}
    table th{text-align:left;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--border);font-size:12px;}
    table td{padding:9px 6px;border-bottom:1px solid var(--border);}
    table td:nth-child(3){font-family:var(--font-mono);}
    .badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;}
    .badge.ok{background:#E4F5E6;color:var(--success);}
    .badge.low{background:#FBF0DC;color:var(--warning);}
    .badge.out{background:#FBE6E6;color:var(--danger);}
    .fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--amber);color:#fff;border:none;font-size:26px;box-shadow:0 4px 16px rgba(240,162,2,.45);cursor:pointer;z-index:15;}
    /* Modal */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(22,48,43,.55);z-index:50;align-items:center;justify-content:center;padding:16px;}
    .modal-bg.active{display:flex;}
    .modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
    .modal h3{margin:0 0 16px;font-size:18px;color:var(--text);}
    .modal-actions{display:flex;gap:8px;margin-top:18px;}
    .modal-actions .btn{flex:1;}
    .btn-bayar{background:var(--amber);color:#fff;}
    .btn-bayar:hover{background:var(--amber-dark);}
    /* Struk */
    .struk{font-family:var(--font-mono);font-size:12.5px;max-width:320px;margin:0 auto;background:#fff;padding:16px;}
    .struk h2{text-align:center;font-size:15px;margin:0 0 2px;font-family:var(--font-display);}
    .struk .sub{text-align:center;font-size:11px;color:#444;margin-bottom:10px;}
    .struk hr{border:none;border-top:1px dashed #999;margin:8px 0;}
    .struk .row{display:flex;justify-content:space-between;}
    .struk .item-row{margin-bottom:4px;}
    /* Laporan */
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
    @media(max-width:600px){.stat-grid{grid-template-columns:1fr;}}
    .stat-box{background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(22,48,43,.06);border:1px solid var(--border);}
    .stat-box .v{font-size:21px;font-weight:700;color:var(--primary);font-family:var(--font-mono);}
    .stat-box .l{font-size:12px;color:var(--muted);margin-top:2px;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:100;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25);}
    .loading-overlay{position:fixed;inset:0;background:rgba(243,246,241,.85);display:none;align-items:center;justify-content:center;z-index:200;font-size:14px;font-weight:700;color:var(--primary);font-family:var(--font-display);}
    @media print{
      body *{visibility:hidden;}
      .struk,.struk *{visibility:visible;}
      .struk{position:absolute;top:0;left:0;}
    }
  </style>
</head>
<body>

  <div id="app" class="app">

    <!-- ============ LOGIN PAGE ============ -->
    <div id="loginPage" class="login-wrap">
      <div class="login-card">
        <div class="login-banner">
          <div class="icon">🏪</div>
          <h1 id="loginNamaWarung">Kasir Warung</h1>
          <p class="tagline">Masuk untuk mulai transaksi</p>
        </div>
        <div class="form-area">
          <div id="loginError" class="error-msg"></div>
          <div class="field">
            <label>Username</label>
            <input type="text" id="loginUsername" autocomplete="username"/>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password"/>
          </div>
          <button class="btn btn-primary" onclick="doLogin()">Masuk</button>
        </div>
      </div>
    </div>

    <!-- ============ MAIN APP ============ -->
    <div id="mainApp" style="display:none;">
      <header class="topbar">
        <div class="brand"><span class="dot"></span>🏪 <span id="brandNama">Kasir Warung</span></div>
        <button class="btn btn-outline" onclick="doLogout()" style="padding:7px 12px;font-size:12.5px;">Keluar</button>
      </header>
      <nav class="tabs">
        <button class="tab-btn active" data-page="kasir" onclick="showPage('kasir')">🧾 Kasir</button>
        <button class="tab-btn" data-page="produk" onclick="showPage('produk')">📦 Produk</button>
        <button class="tab-btn" data-page="laporan" onclick="showPage('laporan')">📊 Laporan</button>
      </nav>

      <main>
        <!-- ===== HALAMAN KASIR ===== -->
        <div id="page-kasir" class="page active">
          <div class="kasir-layout">
            <div>
              <div class="search-box">
                <input type="text" id="cariProduk" placeholder="Cari produk..." oninput="renderProdukGrid()"/>
                <button class="btn-scan" onclick="openScanner('kasir')" title="Scan barcode">📷</button>
              </div>
              <div class="kategori-chips" id="kategoriChips"></div>
              <div class="produk-grid" id="produkGrid"></div>
            </div>
            <div>
              <div class="card cart-card">
                <h3 style="margin-top:0;">Keranjang</h3>
                <div id="cartList"><div class="cart-empty">Belum ada item</div></div>
                <div id="cartTotals" style="display:none;">
                  <div class="total-row"><span>Total Item</span><span id="totalItemQty">0</span></div>
                  <div class="total-row grand"><span>Total</span><span id="totalHarga">Rp 0</span></div>
                </div>
                <button class="btn btn-bayar btn-block" style="margin-top:12px;" onclick="openBayarModal()" id="btnBayar" disabled="disabled">💰 Bayar</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ===== HALAMAN PRODUK ===== -->
        <div id="page-produk" class="page">
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <input type="text" id="cariProdukTable" placeholder="Cari produk..." oninput="renderProdukTable()" style="flex:1;min-width:180px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);"/>
            <button class="btn btn-primary" onclick="openProdukModal()">+ Tambah Produk</button>
          </div>
          <div class="card">
            <table>
              <thead><tr><th>Nama</th><th>Kategori</th><th>Harga Jual</th><th>Stok</th><th>Aksi</th></tr></thead>
              <tbody id="produkTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- ===== HALAMAN LAPORAN ===== -->
        <div id="page-laporan" class="page">
          <div class="card">
            <div class="grid-2">
              <div class="field"><label>Dari Tanggal</label><input type="date" id="laporanDari"/></div>
              <div class="field"><label>Sampai Tanggal</label><input type="date" id="laporanSampai"/></div>
            </div>
            <button class="btn btn-primary" onclick="muatLaporan()">Tampilkan Laporan</button>
          </div>
          <div id="laporanHasil"></div>
        </div>
      </main>

      <button class="fab" onclick="showPage('kasir')" title="Kasir">🧾</button>
      <button class="fab" id="btnInstallApp" style="right:88px;background:var(--amber);display:none;font-size:22px;" onclick="pasangAplikasi()" title="Pasang Aplikasi">⬇️</button>
    </div>
  </div>

  <!-- ===== MODAL: TAMBAH/EDIT PRODUK ===== -->
  <div class="modal-bg" id="modalProduk">
    <div class="modal">
      <h3 id="modalProdukTitle">Tambah Produk</h3>
      <input type="hidden" id="pId"/>
      <div class="field"><label>Nama Produk</label><input type="text" id="pNama"/></div>
      <div class="grid-2">
        <div class="field"><label>Kategori</label><select id="pKategori"></select></div>
        <div class="field"><label>Satuan</label><input type="text" id="pSatuan" placeholder="pcs / kg / botol"/></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Harga Beli</label><input type="number" id="pHargaBeli"/></div>
        <div class="field"><label>Harga Jual</label><input type="number" id="pHargaJual"/></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Stok</label><input type="number" id="pStok"/></div>
        <div class="field"><label>Stok Minimum</label><input type="number" id="pStokMin" value="5"/></div>
      </div>
      <div class="field-with-scan">
        <div class="field"><label>Barcode (opsional)</label><input type="text" id="pBarcode"/></div>
        <button type="button" class="btn-scan-small" onclick="openScanner('produk')" title="Scan barcode">📷</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('modalProduk')">Batal</button>
        <button class="btn btn-danger" id="btnHapusProduk" style="display:none;" onclick="hapusProdukAksi()">Hapus</button>
        <button class="btn btn-primary" onclick="simpanProduk()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: BAYAR ===== -->
  <div class="modal-bg" id="modalBayar">
    <div class="modal">
      <h3>Pembayaran</h3>
      <div class="total-row grand" style="margin-bottom:14px;"><span>Total Belanja</span><span id="bayarTotalHarga">Rp 0</span></div>
      <div class="field">
        <label>Metode Pembayaran</label>
        <select id="metodeBayar"></select>
      </div>
      <div class="field">
        <label>Jumlah Bayar</label>
        <input type="number" id="jumlahBayar" oninput="hitungKembalian()"/>
      </div>
      <div class="total-row" style="font-size:15px;font-weight:700;">
        <span>Kembalian</span><span id="kembalianDisplay">Rp 0</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('modalBayar')">Batal</button>
        <button class="btn btn-bayar" onclick="prosesBayar()">Selesaikan</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: STRUK ===== -->
  <div class="modal-bg" id="modalStruk">
    <div class="modal">
      <div class="struk" id="strukContent"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="window.print()">🖨️ Print / PDF</button>
        <button class="btn btn-primary" onclick="kirimStrukWA()">📱 Kirim WA</button>
      </div>
      <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeModal('modalStruk');showPage('kasir');">Transaksi Baru</button>
    </div>
  </div>

  <!-- ===== MODAL: SCAN BARCODE ===== -->
  <div class="modal-bg" id="modalScanner">
    <div class="modal">
      <h3>Scan Barcode</h3>
      <div id="scannerContainer"></div>
      <div class="scan-hint" id="scannerHint">Arahkan kamera ke barcode produk</div>
      <div class="scan-found" id="scanFoundBox"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" onclick="closeScanner()">Tutup</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="loading-overlay" id="loadingOverlay">Memproses...</div>

  <script>
    // ================== KONFIGURASI ==================
    const API_URL = 'PASTE_URL_WEB_APP_APPS_SCRIPT_ANDA_DI_SINI';

    // ================== STATE ==================
    let TOKEN = localStorage.getItem('kasir_token') || null; // catatan: ganti ke variabel in-memory jika dipakai sbg Artifact
    let INFO_WARUNG = {};
    let PRODUK_LIST = [];
    let KATEGORI_LIST = [];
    let CART = []; // {id, nama, harga, qty, stok}
    let KATEGORI_AKTIF = 'Semua';
    let TRX_TERAKHIR = null;
    let SCANNER_TARGET = null; // 'kasir' atau 'produk'
    let SCANNER_INSTANCE = null;
    let SCANNER_BUSY = false;

    // ================== HELPER ==================
    function rupiah(n){
      return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    }
    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(()=>{ t.style.display = 'none'; }, 2500);
    }
    function showLoading(v){
      document.getElementById('loadingOverlay').style.display = v ? 'flex' : 'none';
    }
    function openModal(id){ document.getElementById(id).classList.add('active'); }
    function closeModal(id){ document.getElementById(id).classList.remove('active'); }

    function apiCall(action, data){
      data = data || {};
      data.action = action;
      if (TOKEN) data.token = TOKEN;
      return fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      }).then(r => r.json());
    }

    // ================== LOGIN ==================
    function doLogin(){
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errBox = document.getElementById('loginError');
      errBox.style.display = 'none';
      if (!username || !password){
        errBox.textContent = 'Username dan password wajib diisi';
        errBox.style.display = 'block';
        return;
      }
      showLoading(true);
      apiCall('login', { username, password }).then(res => {
        showLoading(false);
        if (res.success){
          TOKEN = res.token;
          localStorage.setItem('kasir_token', TOKEN);
          initApp();
        } else {
          errBox.textContent = res.message || 'Login gagal';
          errBox.style.display = 'block';
        }
      }).catch(()=>{
        showLoading(false);
        errBox.textContent = 'Gagal terhubung ke server. Cek koneksi/API_URL.';
        errBox.style.display = 'block';
      });
    }
    function doLogout(){
      TOKEN = null;
      localStorage.removeItem('kasir_token');
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';
    }

    // ================== INIT ==================
    function initApp(){
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      Promise.all([
        apiCall('getInfoWarung', {}),
        apiCall('getProduk', {})
      ]).then(([info, produkRes]) => {
        if (info.success){
          INFO_WARUNG = info;
          document.getElementById('brandNama').textContent = info.namaWarung;
          const sel = document.getElementById('metodeBayar');
          sel.innerHTML = info.metodeBayar.map(m => '<option value="'+m+'">'+m+'</option>').join('');
        }
        if (produkRes.success){
          PRODUK_LIST = produkRes.produk;
          KATEGORI_LIST = produkRes.kategori;
          renderKategoriChips();
          renderProdukGrid();
          renderProdukTable();
          populateKategoriSelect();
        }
      });
      const today = new Date().toISOString().slice(0,10);
      document.getElementById('laporanDari').value = today;
      document.getElementById('laporanSampai').value = today;
    }

    // cek token tersimpan saat pertama load
    window.addEventListener('load', function(){
      document.getElementById('loginNamaWarung').textContent = document.title || 'Kasir Warung';
      if (TOKEN){
        initApp();
      }
    });

    // ================== PWA: PASANG KE LAYAR UTAMA ==================
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      deferredInstallPrompt = e;
      document.getElementById('btnInstallApp').style.display = 'flex';
    });
    function pasangAplikasi(){
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(){
        deferredInstallPrompt = null;
        document.getElementById('btnInstallApp').style.display = 'none';
      });
    }
    window.addEventListener('appinstalled', function(){
      document.getElementById('btnInstallApp').style.display = 'none';
      showToast('Aplikasi berhasil dipasang di layar utama');
    });

    // ================== NAVIGASI TAB ==================
    function showPage(page){
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-'+page).classList.add('active');
      document.querySelector('.tab-btn[data-page="'+page+'"]').classList.add('active');
      if (page === 'produk') renderProdukTable();
    }

    // ================== KASIR: GRID PRODUK ==================
    function renderKategoriChips(){
      const box = document.getElementById('kategoriChips');
      const semua = ['Semua'].concat(KATEGORI_LIST);
      box.innerHTML = semua.map(k =>
        '<div class="chip'+(k===KATEGORI_AKTIF?' active':'')+'" onclick="pilihKategori(\''+k+'\')">'+k+'</div>'
      ).join('');
    }
    function pilihKategori(k){
      KATEGORI_AKTIF = k;
      renderKategoriChips();
      renderProdukGrid();
    }
    function renderProdukGrid(){
      const q = (document.getElementById('cariProduk').value || '').toLowerCase();
      const grid = document.getElementById('produkGrid');
      let list = PRODUK_LIST.filter(p => p.status === 'Aktif');
      if (KATEGORI_AKTIF !== 'Semua') list = list.filter(p => p.kategori === KATEGORI_AKTIF);
      if (q) list = list.filter(p => p.nama.toLowerCase().indexOf(q) > -1);

      if (list.length === 0){
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0;">Produk tidak ditemukan</div>';
        return;
      }
      grid.innerHTML = list.map(p => {
        let stokClass = '', stokText = p.stok + ' ' + p.satuan;
        if (p.stok <= 0){ stokClass = 'habis'; stokText = 'Stok habis'; }
        else if (p.stok <= p.stokMinimum){ stokClass = 'low'; }
        return '<div class="produk-item" style="--kat-color:'+warnaKategori(p.kategori)+'" onclick="tambahKeCart(\''+p.id+'\')">' +
          '<div class="nama">'+p.nama+'</div>' +
          '<div class="harga">'+rupiah(p.hargaJual)+'</div>' +
          '<div class="stok '+stokClass+'">'+stokText+'</div>' +
          '</div>';
      }).join('');
    }
    // palet aksen kategori — konsisten per nama kategori
    const PALET_KATEGORI = ['#0E7C66','#F0A202','#3B6EA5','#B24C63','#7A6FBE','#5C8A3A','#C9762F'];
    function warnaKategori(nama){
      let hash = 0;
      for (let i = 0; i < (nama||'').length; i++) hash = (hash * 31 + nama.charCodeAt(i)) >>> 0;
      return PALET_KATEGORI[hash % PALET_KATEGORI.length];
    }

    // ================== KASIR: KERANJANG ==================
    function tambahKeCart(id){
      const p = PRODUK_LIST.find(x => x.id === id);
      if (!p || p.stok <= 0){ showToast('Stok habis'); return; }
      const existing = CART.find(c => c.id === id);
      if (existing){
        if (existing.qty >= p.stok){ showToast('Stok tidak cukup'); return; }
        existing.qty++;
      } else {
        CART.push({ id: p.id, nama: p.nama, harga: p.hargaJual, qty: 1, stok: p.stok });
      }
      renderCart();
    }
    function ubahQty(id, delta){
      const item = CART.find(c => c.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0){
        CART = CART.filter(c => c.id !== id);
      } else if (item.qty > item.stok){
        showToast('Stok tidak cukup'); item.qty = item.stok;
      }
      renderCart();
    }
    function renderCart(){
      const list = document.getElementById('cartList');
      const totals = document.getElementById('cartTotals');
      const btnBayar = document.getElementById('btnBayar');
      if (CART.length === 0){
        list.innerHTML = '<div class="cart-empty">Belum ada item</div>';
        totals.style.display = 'none';
        btnBayar.disabled = true;
        return;
      }
      list.innerHTML = CART.map(c =>
        '<div class="cart-item">' +
          '<div class="info"><div class="n">'+c.nama+'</div><div class="h">'+rupiah(c.harga)+'</div></div>' +
          '<div class="qty-ctrl">' +
            '<button onclick="ubahQty(\''+c.id+'\',-1)">−</button>' +
            '<span>'+c.qty+'</span>' +
            '<button onclick="ubahQty(\''+c.id+'\',1)">+</button>' +
          '</div>' +
        '</div>'
      ).join('');
      const totalItem = CART.reduce((s,c)=>s+c.qty,0);
      const totalHarga = CART.reduce((s,c)=>s+c.qty*c.harga,0);
      document.getElementById('totalItemQty').textContent = totalItem;
      document.getElementById('totalHarga').textContent = rupiah(totalHarga);
      totals.style.display = 'block';
      btnBayar.disabled = false;
    }

    // ================== SCAN BARCODE ==================
    function openScanner(target){
      SCANNER_TARGET = target;
      document.getElementById('scanFoundBox').style.display = 'none';
      document.getElementById('scannerHint').textContent = 'Arahkan kamera ke barcode produk';
      openModal('modalScanner');

      if (typeof Html5Qrcode === 'undefined'){
        document.getElementById('scannerHint').textContent = 'Gagal memuat pustaka scanner. Cek koneksi internet lalu coba lagi.';
        return;
      }

      SCANNER_INSTANCE = new Html5Qrcode('scannerContainer');
      SCANNER_BUSY = false;
      const config = { fps: 10, qrbox: { width: 260, height: 140 } };
      SCANNER_INSTANCE.start(
        { facingMode: 'environment' },
        config,
        onScanSuccess,
        () => {} // error decode per-frame, diabaikan (normal saat belum ketemu barcode)
      ).catch(err => {
        document.getElementById('scannerHint').textContent = 'Tidak bisa mengakses kamera. Pastikan izin kamera diaktifkan untuk situs ini.';
      });
    }

    function closeScanner(){
      closeModal('modalScanner');
      if (SCANNER_INSTANCE){
        SCANNER_INSTANCE.stop().then(() => {
          SCANNER_INSTANCE.clear();
          SCANNER_INSTANCE = null;
        }).catch(() => { SCANNER_INSTANCE = null; });
      }
    }

    function onScanSuccess(decodedText){
      if (SCANNER_BUSY) return; // cegah trigger berkali-kali dari frame berturut-turut
      SCANNER_BUSY = true;

      if (SCANNER_TARGET === 'produk'){
        document.getElementById('pBarcode').value = decodedText;
        closeScanner();
        showToast('Barcode terisi: ' + decodedText);
        return;
      }

      // target: kasir -> cari produk lalu tambahkan ke keranjang
      const p = PRODUK_LIST.find(x => x.barcode && String(x.barcode).trim() === String(decodedText).trim());
      const box = document.getElementById('scanFoundBox');
      if (p){
        tambahKeCart(p.id);
        box.style.display = 'block';
        box.style.background = '#f0fdf4';
        box.style.borderColor = '#bbf7d0';
        box.textContent = '✓ ' + p.nama + ' ditambahkan ke keranjang';
        // beri jeda supaya kasir lihat konfirmasi sebelum lanjut scan berikutnya
        setTimeout(() => { SCANNER_BUSY = false; box.style.display = 'none'; }, 1200);
      } else {
        box.style.display = 'block';
        box.style.background = '#fef2f2';
        box.style.borderColor = '#fecaca';
        box.textContent = 'Barcode "' + decodedText + '" tidak ditemukan di daftar produk';
        setTimeout(() => { SCANNER_BUSY = false; box.style.display = 'none'; }, 1500);
      }
    }

    // ================== PEMBAYARAN ==================
    function openBayarModal(){
      const totalHarga = CART.reduce((s,c)=>s+c.qty*c.harga,0);
      document.getElementById('bayarTotalHarga').textContent = rupiah(totalHarga);
      document.getElementById('jumlahBayar').value = totalHarga;
      hitungKembalian();
      openModal('modalBayar');
    }
    function hitungKembalian(){
      const totalHarga = CART.reduce((s,c)=>s+c.qty*c.harga,0);
      const bayar = Number(document.getElementById('jumlahBayar').value || 0);
      const kembalian = bayar - totalHarga;
      const el = document.getElementById('kembalianDisplay');
      el.textContent = rupiah(Math.max(kembalian,0) * 0 + kembalian);
      el.style.color = kembalian < 0 ? 'var(--danger)' : 'var(--success)';
    }
    function prosesBayar(){
      const totalHarga = CART.reduce((s,c)=>s+c.qty*c.harga,0);
      const bayar = Number(document.getElementById('jumlahBayar').value || 0);
      if (bayar < totalHarga){ showToast('Jumlah bayar kurang'); return; }
      const metodeBayar = document.getElementById('metodeBayar').value;
      showLoading(true);
      apiCall('checkout', {
        items: JSON.stringify(CART.map(c => ({ id:c.id, nama:c.nama, qty:c.qty, harga:c.harga }))),
        bayar: bayar, metodeBayar: metodeBayar
      }).then(res => {
        showLoading(false);
        if (res.success){
          closeModal('modalBayar');
          CART = [];
          renderCart();
          TRX_TERAKHIR = res.idTransaksi;
          tampilkanStruk(res.idTransaksi);
          apiCall('getProduk', {}).then(pr => { if (pr.success) PRODUK_LIST = pr.produk; renderProdukGrid(); renderProdukTable(); });
        } else {
          showToast(res.message || 'Transaksi gagal');
        }
      });
    }

    // ================== STRUK ==================
    function tampilkanStruk(idTransaksi){
      showLoading(true);
      apiCall('getStruk', { idTransaksi }).then(res => {
        showLoading(false);
        if (!res.success){ showToast(res.message); return; }
        const t = res.transaksi;
        let html = '<h2>'+res.namaWarung+'</h2>';
        html += '<div class="sub">'+res.alamat+'</div>';
        html += '<hr/>';
        html += '<div class="row"><span>'+t.id+'</span><span>'+new Date(t.tanggal).toLocaleString('id-ID')+'</span></div>';
        html += '<div class="row"><span>Kasir</span><span>'+t.kasir+'</span></div>';
        html += '<hr/>';
        res.items.forEach(it => {
          html += '<div class="item-row">' +
            '<div>'+it.nama+'</div>' +
            '<div class="row"><span>'+it.qty+' x '+rupiah(it.harga)+'</span><span>'+rupiah(it.subtotal)+'</span></div>' +
          '</div>';
        });
        html += '<hr/>';
        html += '<div class="row" style="font-weight:700;"><span>TOTAL</span><span>'+rupiah(t.totalHarga)+'</span></div>';
        html += '<div class="row"><span>'+t.metodeBayar+'</span><span>'+rupiah(t.bayar)+'</span></div>';
        html += '<div class="row"><span>Kembalian</span><span>'+rupiah(t.kembalian)+'</span></div>';
        html += '<hr/>';
        html += '<div class="sub">'+res.footer+'</div>';
        document.getElementById('strukContent').innerHTML = html;
        window._strukData = res;
        openModal('modalStruk');
      });
    }
    function kirimStrukWA(){
      const res = window._strukData;
      if (!res) return;
      let text = '*'+res.namaWarung+'*\n'+res.alamat+'\n\n';
      text += res.transaksi.id + ' - ' + new Date(res.transaksi.tanggal).toLocaleString('id-ID') + '\n\n';
      res.items.forEach(it => {
        text += it.nama + ' (' + it.qty + 'x' + rupiah(it.harga) + ') = ' + rupiah(it.subtotal) + '\n';
      });
      text += '\nTOTAL: ' + rupiah(res.transaksi.totalHarga);
      text += '\n' + res.transaksi.metodeBayar + ': ' + rupiah(res.transaksi.bayar);
      text += '\nKembalian: ' + rupiah(res.transaksi.kembalian);
      text += '\n\n' + res.footer;
      const url = 'https://wa.me/?text=' + encodeURIComponent(text);
      window.open(url, '_blank');
    }

    // ================== PRODUK: MANAJEMEN ==================
    function populateKategoriSelect(){
      const sel = document.getElementById('pKategori');
      sel.innerHTML = KATEGORI_LIST.map(k => '<option value="'+k+'">'+k+'</option>').join('');
    }
    function renderProdukTable(){
      const q = (document.getElementById('cariProdukTable').value || '').toLowerCase();
      const body = document.getElementById('produkTableBody');
      let list = PRODUK_LIST;
      if (q) list = list.filter(p => p.nama.toLowerCase().indexOf(q) > -1);
      if (list.length === 0){
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Tidak ada produk</td></tr>';
        return;
      }
      body.innerHTML = list.map(p => {
        let badge = '<span class="badge ok">Aman</span>';
        if (p.stok <= 0) badge = '<span class="badge out">Habis</span>';
        else if (p.stok <= p.stokMinimum) badge = '<span class="badge low">Menipis</span>';
        return '<tr>' +
          '<td>'+p.nama+'</td>' +
          '<td>'+p.kategori+'</td>' +
          '<td>'+rupiah(p.hargaJual)+'</td>' +
          '<td>'+p.stok+' '+p.satuan+' '+badge+'</td>' +
          '<td><button class="btn btn-outline" style="padding:6px 10px;font-size:12px;" onclick="openProdukModal(\''+p.id+'\')">Edit</button></td>' +
        '</tr>';
      }).join('');
    }
    function openProdukModal(id){
      document.getElementById('btnHapusProduk').style.display = id ? 'inline-flex' : 'none';
      if (id){
        const p = PRODUK_LIST.find(x => x.id === id);
        document.getElementById('modalProdukTitle').textContent = 'Edit Produk';
        document.getElementById('pId').value = p.id;
        document.getElementById('pNama').value = p.nama;
        document.getElementById('pKategori').value = p.kategori;
        document.getElementById('pSatuan').value = p.satuan;
        document.getElementById('pHargaBeli').value = p.hargaBeli;
        document.getElementById('pHargaJual').value = p.hargaJual;
        document.getElementById('pStok').value = p.stok;
        document.getElementById('pStokMin').value = p.stokMinimum;
        document.getElementById('pBarcode').value = p.barcode;
      } else {
        document.getElementById('modalProdukTitle').textContent = 'Tambah Produk';
        ['pId','pNama','pSatuan','pHargaBeli','pHargaJual','pStok','pBarcode'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('pStokMin').value = 5;
      }
      openModal('modalProduk');
    }
    function simpanProduk(){
      const produk = {
        id: document.getElementById('pId').value,
        nama: document.getElementById('pNama').value.trim(),
        kategori: document.getElementById('pKategori').value,
        satuan: document.getElementById('pSatuan').value.trim() || 'pcs',
        hargaBeli: Number(document.getElementById('pHargaBeli').value || 0),
        hargaJual: Number(document.getElementById('pHargaJual').value || 0),
        stok: Number(document.getElementById('pStok').value || 0),
        stokMinimum: Number(document.getElementById('pStokMin').value || 0),
        barcode: document.getElementById('pBarcode').value.trim()
      };
      if (!produk.nama || !produk.hargaJual){ showToast('Nama dan harga jual wajib diisi'); return; }
      showLoading(true);
      apiCall('saveProduk', { produk: JSON.stringify(produk) }).then(res => {
        showLoading(false);
        showToast(res.message);
        if (res.success){
          closeModal('modalProduk');
          apiCall('getProduk', {}).then(pr => {
            if (pr.success){ PRODUK_LIST = pr.produk; renderProdukTable(); renderProdukGrid(); }
          });
        }
      });
    }
    function hapusProdukAksi(){
      const id = document.getElementById('pId').value;
      if (!confirm('Hapus produk ini?')) return;
      showLoading(true);
      apiCall('deleteProduk', { id }).then(res => {
        showLoading(false);
        showToast(res.message);
        if (res.success){
          closeModal('modalProduk');
          apiCall('getProduk', {}).then(pr => {
            if (pr.success){ PRODUK_LIST = pr.produk; renderProdukTable(); renderProdukGrid(); }
          });
        }
      });
    }

    // ================== LAPORAN ==================
    function muatLaporan(){
      const dari = document.getElementById('laporanDari').value;
      const sampai = document.getElementById('laporanSampai').value;
      if (!dari || !sampai){ showToast('Pilih rentang tanggal'); return; }
      showLoading(true);
      apiCall('getLaporan', { dari, sampai }).then(res => {
        showLoading(false);
        if (!res.success){ showToast(res.message); return; }
        const r = res.ringkasan;
        let html = '<div class="stat-grid">' +
          '<div class="stat-box"><div class="v">'+r.totalTransaksi+'</div><div class="l">Transaksi</div></div>' +
          '<div class="stat-box"><div class="v">'+rupiah(r.totalOmzet)+'</div><div class="l">Omzet</div></div>' +
          '<div class="stat-box"><div class="v">'+r.totalItem+'</div><div class="l">Item Terjual</div></div>' +
        '</div>';

        html += '<div class="card"><h3 style="margin-top:0;">Produk Terlaris</h3>';
        if (res.terlaris.length === 0){
          html += '<div style="color:var(--muted);font-size:13px;">Belum ada data</div>';
        } else {
          html += '<table><thead><tr><th>Produk</th><th>Qty Terjual</th></tr></thead><tbody>';
          res.terlaris.forEach(t => { html += '<tr><td>'+t.nama+'</td><td>'+t.qty+'</td></tr>'; });
          html += '</tbody></table>';
        }
        html += '</div>';

        html += '<div class="card"><h3 style="margin-top:0;">Rincian Transaksi</h3>';
        if (res.daftarTransaksi.length === 0){
          html += '<div style="color:var(--muted);font-size:13px;">Belum ada transaksi pada rentang ini</div>';
        } else {
          html += '<table><thead><tr><th>ID</th><th>Tanggal</th><th>Item</th><th>Total</th><th>Metode</th></tr></thead><tbody>';
          res.daftarTransaksi.forEach(t => {
            html += '<tr><td>'+t.id+'</td><td>'+new Date(t.tanggal).toLocaleString('id-ID')+'</td><td>'+t.totalItem+'</td><td>'+rupiah(t.totalHarga)+'</td><td>'+t.metodeBayar+'</td></tr>';
          });
          html += '</tbody></table>';
        }
        html += '</div>';

        document.getElementById('laporanHasil').innerHTML = html;
      });
    }
  </script>

<script>
  // Daftarkan service worker untuk dukungan offline (app shell)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {
        console.warn('Service worker gagal didaftarkan:', err);
      });
    });
  }
</script>
